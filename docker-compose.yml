services:
  bf-platform:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-python:3.11-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    image: bf-platform:latest
    container_name: bf-platform
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - TZ=Asia/Shanghai
      # 必须显式指定：否则 DB 与模型产物落在容器内层，rebuild 即丢
      - BF_DB_PATH=/app/data/platform.db
      - BF_MODELS_DIR=/app/data/models
    volumes:
      # 持久化数据：SQLite 库 + 模型产物
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
