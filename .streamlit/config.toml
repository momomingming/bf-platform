[server]
headless = true
address = "0.0.0.0"
port = 8501
maxUploadSize = 50
enableXsrfProtection = true
enableCORS = false

[theme]
base = "light"
primaryColor = "#185FA5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "sans serif"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true
